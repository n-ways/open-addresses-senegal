# N-Ways Addressing for Senegal: the registry API (OpenAPI 3.1). Served by server/ (python3 -m server serve).
openapi: 3.1.0
info:
  title: 'N-Ways Addressing for Senegal: registry API'
  version: '1'
  description: 'Serves the published registry of Senegal''s N-Ways addresses and, on the deployment designated as the issuer,
    issues new ones by the same rules. Every response is JSON; an error is {"error": {"code", "message"}} with the matching
    HTTP status. Examples are real responses from a server running on the full registry; long lists are shortened.'
  license:
    name: Apache-2.0 (code); ODbL 1.0 (data)
    identifier: Apache-2.0
  contact:
    name: N-WAYS LIMITED
    url: https://nways.ng
    email: hello@nways.ng
servers:
- url: http://localhost:8080
  description: docker compose up
paths:
  /v1/health:
    get:
      summary: Service health
      operationId: health
      responses:
        '200':
          description: Up
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              examples:
                ok:
                  summary: Health
                  value:
                    status: ok
                    country: SN
                    codes: 3597128
                    registryExported: '2026-10-21T18:48:16Z'
